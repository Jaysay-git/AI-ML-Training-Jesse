name: Week 7 Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Week 7 dependencies
        working-directory: Week 7
        run: python -m pip install -r requirements.txt

      - name: Run Week 7 tests
        working-directory: Week 7
        run: python -m pytest tests/test_llm_service.py -v
