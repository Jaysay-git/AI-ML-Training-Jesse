
name: Week 9 Tests

on:
  push:
    paths:
      - "Week 9/**"
      - ".github/workflows/week9-tests.yml"
  pull_request:
    paths:
      - "Week 9/**"
      - ".github/workflows/week9-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Week 9

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Week 9 tests
        run: python -m pytest tests -v
