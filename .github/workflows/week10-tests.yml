name: Week 10 Tests

on:
  push:
    paths:
      - "Week 10/**"
      - ".github/workflows/week10-tests.yml"
  pull_request:
    paths:
      - "Week 10/**"
      - ".github/workflows/week10-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: "Week 10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: "Week 10/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Week 10 tests
        run: python -m pytest tests -v

      - name: Run offline evaluation
        run: python evaluation_offline.py
