name: Week 2 Tests

on:
  push:
    branches:
      - main
    paths:
      - "Week 2/**"
      - ".github/workflows/week2-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Week 2/**"
      - ".github/workflows/week2-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Week 2 dependencies
        working-directory: Week 2
        run: python -m pip install -r requirements.txt

      - name: Run Week 2 tests
        working-directory: Week 2
        run: python -m pytest tests