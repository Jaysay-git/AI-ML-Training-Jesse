name: Week 12 - Naija Cost of Living Intelligence Tests

on:
  push:
    branches: [main]
    paths:
      - "Week 12/**"
      - ".github/workflows/week12-tests.yml"

  pull_request:
    branches: [main]
    paths:
      - "Week 12/**"
      - ".github/workflows/week12-tests.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: week12-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Week 12 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: Week 12

    env:
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET_KEY: ci-only-test-secret-do-not-use-in-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      DEBUG: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            Week 12/requirements.txt
            Week 12/requirements-api.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-api.txt
          pip install pytest

      - name: Compile application modules
        run: python -m compileall -q app frontend scripts tests

      - name: Run Week 12 tests
        run: python -m pytest tests -v
