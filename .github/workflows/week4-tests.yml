
name: Week 4 Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci-test-secret-key-that-is-at-least-32-characters-long"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Week 4/requirements.txt"

      - name: Run tests
        working-directory: "Week 4"
        run: python -m pytest tests
