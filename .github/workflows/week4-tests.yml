name: Week 4 Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci-test-secret-key-that-is-at-least-32-characters-long"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5433/hospital_patients"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_patients
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hospital_patients"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "Week 4/requirements.txt"

      - name: Run database migrations
        working-directory: "Week 4"
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: "Week 4"
        run: python -m pytest tests
