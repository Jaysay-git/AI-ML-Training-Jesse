name: Week 3 Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_patients
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d hospital_patients"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Week 3 dependencies
        working-directory: Week 3
        run: python -m pip install -r requirements.txt

      - name: Run database migrations
        working-directory: Week 3
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/hospital_patients
        run: python -m alembic upgrade head

      - name: Run Week 3 tests
        working-directory: Week 3
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/hospital_patients
        run: python -m pytest tests