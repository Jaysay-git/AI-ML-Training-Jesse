services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: naija-cost-api

    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: sqlite:////app/storage/naija_cost_of_living.db

    volumes:
      - ./storage:/app/storage
      - ./chroma_db:/app/chroma_db

    restart: unless-stopped